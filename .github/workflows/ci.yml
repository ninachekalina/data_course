name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:4.4
        env:
          MONGO_INITDB_DATABASE: rag_db
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        MONGODB_URI: mongodb://localhost:27017/
        MONGODB_DB_NAME: rag_db
        MONGODB_COLLECTION_NAME: chat_history
      run: |
        python -m pytest tests/ -v