name: MongoDB Course CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
        # Set health checks to wait until mongodb is ready
        options: >-
          --health-cmd="mongo --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          # The test runner expects MongoDB on localhost:27017
          # The service automatically sets up the connection
          MONGODB_URI: mongodb://localhost:27017/mongodb_course
        run: npm test